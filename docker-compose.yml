version: "3"

services:
  nats-server:
    image: nats:latest
    ports:
      - "8222:8222"

  client-gateway:
    build: ./client-gateway
    ports:
      - ${CLIENT_GATEGAY_PORT}:${CLIENT_GATEGAY_PORT}
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222

  auth-ms:
    build: ./auth-ms
    depends_on:
      auth-db:
        condition: service_healthy
      nats-server:
        condition: service_started
    volumes:
      - ./auth-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      PORT: 3004
      NATS_SERVERS: nats://nats-server:4222
      DATABASE_URL: postgresql://postgres:1234567@auth-db:5432/authdb?schema=public
      JWT_SECRET: ${JWT_SECRET}

  auth-db:
    container_name: auth_database
    image: postgres:14.3
    restart: always
    volumes:
      - ./auth-ms/postgres:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234567"
      POSTGRES_DB: authdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

